# Автоматически подхватывается `docker compose up` / `podman-compose up`.
# Только локальная разработка — в проде не использовать.
#
# Проброс на loopback хоста:
#   MongoDB → :27017, API → :8080, UI → :8088
services:
  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  scainer:
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    ports:
      - "127.0.0.1:8088:80"

# Прод: только nginx на loopback. MongoDB и API — внутри compose-сети.
# Reverse proxy с TLS → http://127.0.0.1:8088
services:
  scainer:
    networks:
      - default
      - monitoring

  nginx:
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - default
      - proxy
    environment:
      - VIRTUAL_HOST=scainer.d.lksh.ru
networks:
  monitoring:
    external: true
    name: monitoring_default
  proxy:
    external: true

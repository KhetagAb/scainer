services:
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  scainer:
    build:
      context: ./scainer
    image: scainer:local
    env_file:
      - ./scainer/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: scainer-front/Dockerfile
    depends_on:
      - scainer
    restart: unless-stopped

volumes:
  mongodb_data:

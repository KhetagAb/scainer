server {
    listen 80;

    # pdf.js worker собирается как *.mjs; без этого nginx отдаёт application/octet-stream,
    # браузер не запускает module script — PDF на ревью не открывается (локально Vite ок).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # SSE: job progress — без proxy_buffering ответ копится до конца.
    location /api/jobs/ {
        proxy_pass http://scainer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api {
        proxy_pass http://scainer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /opt/build;
        index index.html;
        try_files $uri /index.html;
    }
}

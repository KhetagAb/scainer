server {
    listen 80;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # SSE-поток прогресса job'а: без proxy_buffering nginx копит весь ответ перед отдачей клиенту,
    # что убивает "реальное время"; таймауты подняты — один Detector.Analyze может идти минуты
    # (сервер шлёт heartbeat каждые 15с, так что дольше 60с молчания между байтами не бывает).
    location /api/jobs/ {
        proxy_pass http://scainer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api {
        proxy_pass http://scainer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /opt/build;
        index index.html;
        try_files $uri /index.html;
    }
}

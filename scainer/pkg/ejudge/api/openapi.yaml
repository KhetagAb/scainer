# lksh: /ej/api/v1/... → 404; рабочие entrypoint — /cgi-bin/new-master|master.
# Один GET+POST на new-master (JSON/form); master — только download-run (binary).
openapi: 3.0.3
info:
  title: ejudge API (scainer subset)
  version: "1.0"
servers:
  - url: /
security:
  - ApiKeyAuth: []
paths:
  /cgi-bin/new-master:
    get:
      operationId: masterJSON
      summary: Privileged JSON CGI (action=list-runs-json|contest-status-json|…)
      parameters:
        - $ref: "#/components/parameters/JsonFlag"
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - list-runs-json
              - contest-status-json
              - run-status-json
              - run-messages-json
        - $ref: "#/components/parameters/ContestId"
        - name: run_id
          in: query
          schema: { type: integer }
        - name: first_run
          in: query
          schema: { type: integer }
        - name: last_run
          in: query
          schema: { type: integer }
        - name: filter_expr
          in: query
          schema: { type: string }
        - name: field_mask
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: JSON envelope (result зависит от action)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONEnvelope"
    post:
      operationId: masterForm
      summary: Privileged form CGI (action=64 comment, 67 status, …)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [json, action, contest_id]
              properties:
                json:
                  type: integer
                  enum: [1]
                action:
                  type: string
                  description: "CGI action code or name (64=comment, 67=status)"
                contest_id:
                  type: integer
                run_id:
                  type: integer
                status:
                  type: integer
                  description: numeric ejudge status for action=67
                msg_text:
                  type: string
                  description: comment text for action=64
      responses:
        "200":
          description: JSON envelope or legacy HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONEnvelope"
            text/html:
              schema:
                type: string

  /cgi-bin/master:
    get:
      operationId: downloadRun
      summary: Download run source (privileged)
      parameters:
        - $ref: "#/components/parameters/JsonFlag"
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [download-run]
        - $ref: "#/components/parameters/ContestId"
        - name: run_id
          in: query
          required: true
          schema: { type: integer }
        - name: no_disp
          in: query
          description: do not send Content-Disposition
          schema: { type: integer }
      responses:
        "200":
          description: Source text
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Value: Bearer AQAA<token>"

  parameters:
    ContestId:
      name: contest_id
      in: query
      required: true
      schema: { type: integer }

    JsonFlag:
      name: json
      in: query
      required: true
      description: request JSON envelope (ejudge cgi)
      schema:
        type: integer
        enum: [1]

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        symbol: { type: string }
        num: { type: integer }
        log_id: { type: string }

    JSONEnvelope:
      type: object
      properties:
        ok: { type: boolean }
        error:
          $ref: "#/components/schemas/Error"
        result:
          type: object
          additionalProperties: true
        server_time: { type: integer }

    ListRunsReply:
      type: object
      properties:
        ok: { type: boolean }
        error:
          $ref: "#/components/schemas/Error"
        result:
          $ref: "#/components/schemas/ListRunsResult"
        server_time: { type: integer }

    ListRunsResult:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        first_run: { type: integer }
        last_run: { type: integer }
        total_runs: { type: integer }
        filtered_runs: { type: integer }
        listed_runs: { type: integer }
        transient_runs: { type: integer }
        field_mask: { type: integer }

    ContestStatusReply:
      type: object
      properties:
        ok: { type: boolean }
        error:
          $ref: "#/components/schemas/Error"
        result:
          $ref: "#/components/schemas/ContestStatusResult"
        server_time: { type: integer }

    ContestStatusResult:
      type: object
      properties:
        contest:
          $ref: "#/components/schemas/ContestBrief"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemBrief"

    ContestBrief:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    ProblemBrief:
      type: object
      properties:
        id: { type: integer }
        short_name: { type: string }
        name: { type: string }
        internal_name: { type: string }

    RunStatusReply:
      type: object
      properties:
        ok: { type: boolean }
        error:
          $ref: "#/components/schemas/Error"
        result:
          $ref: "#/components/schemas/RunStatusResult"
        server_time: { type: integer }

    RunStatusResult:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunStatusRun"

    RunStatusRun:
      type: object
      properties:
        run_id: { type: integer }
        status: { type: integer }
        status_str: { type: string }

    RunMessagesReply:
      type: object
      properties:
        ok: { type: boolean }
        error:
          $ref: "#/components/schemas/Error"
        result:
          $ref: "#/components/schemas/RunMessagesResult"
        server_time: { type: integer }

    RunMessagesResult:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/RunMessage"

    RunMessage:
      type: object
      properties:
        clar_id: { type: integer }
        from: { type: integer }
        to: { type: integer }
        subject: { type: string }
        time_us: { type: integer, format: int64 }
        size: { type: integer }
        content:
          $ref: "#/components/schemas/EncodedContent"

    EncodedContent:
      type: object
      properties:
        data: { type: string }
        method: { type: integer }
        size: { type: integer }

    Run:
      type: object
      properties:
        run_id: { type: integer }
        serial_id: { type: integer }
        run_uuid: { type: string }
        user_id: { type: integer }
        user_login: { type: string }
        user_name: { type: string }
        prob_id: { type: integer }
        prob_short_name: { type: string }
        prob_internal_name: { type: string }
        prob_name: { type: string }
        lang_id: { type: integer }
        lang_name: { type: string }
        status: { type: integer }
        status_str: { type: string }
        score: { type: integer }
        run_time: { type: integer }
        run_time_us: { type: integer }
        last_change_us: { type: integer }
        failed_test: { type: integer }
        passed_mode: { type: integer }
        raw_test: { type: integer }
        contest_id: { type: integer }

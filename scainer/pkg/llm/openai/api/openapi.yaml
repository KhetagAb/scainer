# Минимальный срез OpenAI-совместимого API Ollama для scainer.
# https://docs.ollama.com/api/openai-compatibility
openapi: 3.0.3
info:
  title: OpenAI-compatible API (Ollama subset)
  version: "1.0"
servers:
  - url: /
security:
  - BasicAuth: []
paths:
  /models:
    get:
      operationId: listModels
      summary: List models
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"

  /models/{model}:
    get:
      operationId: getModel
      summary: Get model
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"

  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Chat completions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  schemas:
    Model:
      type: object
      required: [id, object]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        owned_by: { type: string }

    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string }
        content: { type: string }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature: { type: number, format: double }
        top_p: { type: number, format: double }
        max_tokens: { type: integer }
        seed: { type: integer }
        stream: { type: boolean }

    ChatCompletionChoice:
      type: object
      properties:
        index: { type: integer }
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason: { type: string }

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/Usage"

    APIError:
      type: object
      properties:
        message: { type: string }
        type: { type: string }
        code: { type: string }

    ErrorReply:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/APIError"
